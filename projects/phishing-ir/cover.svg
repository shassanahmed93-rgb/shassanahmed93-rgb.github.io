<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">PhishOps incident response playbook</title><desc id="desc">A dark navy incident console illustration with response phases and an active evidence path.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12253a"/><stop offset="1" stop-color="#0a101c"/></linearGradient><radialGradient id="glow"><stop stop-color="#3fd8ec" stop-opacity=".19"/><stop offset="1" stop-color="#3fd8ec" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="620" fill="url(#g)"/><ellipse cx="930" cy="80" rx="470" ry="300" fill="url(#glow)"/><g stroke="#233350" opacity=".75"><path d="M0 80h1200M0 160h1200M0 240h1200M0 320h1200M0 400h1200M0 480h1200M0 560h1200"/><path d="M80 0v620M160 0v620M240 0v620M320 0v620M400 0v620M480 0v620M560 0v620M640 0v620M720 0v620M800 0v620M880 0v620M960 0v620M1040 0v620M1120 0v620"/></g><rect x="78" y="72" width="1044" height="476" rx="18" fill="#0c1524" stroke="#314461"/><circle cx="113" cy="108" r="6" fill="#5be3a1"/><text x="135" y="114" fill="#8c9dba" font-family="monospace" font-size="15" letter-spacing="2">PHISHOPS / INCIDENT RESPONSE</text><text x="112" y="222" fill="#dde7f5" font-family="Arial,sans-serif" font-size="68" font-weight="700">Respond with</text><text x="112" y="300" fill="#3fd8ec" font-family="Arial,sans-serif" font-size="68" font-weight="700">clarity.</text><text x="115" y="347" fill="#8c9dba" font-family="monospace" font-size="15" letter-spacing="1">A PHISHING &amp; BEC RESPONSE SIMULATION</text><rect x="708" y="154" width="340" height="262" rx="10" fill="#111a2b" stroke="#314461"/><text x="735" y="190" fill="#8c9dba" font-family="monospace" font-size="13">RESPONSE PHASES</text><g font-family="monospace" font-size="13"><text x="735" y="239" fill="#dde7f5">01  INTAKE</text><text x="735" y="279" fill="#dde7f5">02  TRIAGE</text><text x="735" y="319" fill="#dde7